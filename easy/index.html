<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <img src="./assests/logo.png" alt="">
        <div class="info">
            <h3>Home</h3>
            <h3>About us</h3>
            <h3>Blogs</h3>
            <h3>Contact Us</h3>
        </div>
        <button>Get Started</button>
    </nav>
    <h1 id="title">Insights & Blogs</h1>
    <div class="buttons">
        <button id="unique">All</button>
        <button>Tech</button>
        <button>SaaS</button>
        <button>Marketing</button>
    </div>
    <div class="cards">
        <div class="card">
            <img src="./assests/glass.png" alt="Tech">
            <div class="info">
                <span id="about">Tech</span>
                <p>The Ultimate Guide To SaaS <br> Marketing </p>
                <span id="date">May 23,2025</span>
            </div>
        </div>
        <div class="card">
            <img src="./assests/chair.png" alt="SaaS">
            <div class="info">
                <span id="about">SaaS</span>
                <p>5 Key Trends in SaaS <br> Growth for 2025 </p>
                <span id="date">May 23,2025</span>
            </div>
        </div>
        <div class="card">
            <img src="./assests/cat.png" alt="Marketing">
            <div class="info">
                <span id="about">Marketing</span>
                <p>How Data-Driven <br> Strategies Are Important</p>
                <span id="date">May 23,2025</span>
            </div>
        </div>
    </div>
</body>
</html>
